name: Publish Snapshot

on:
  push:
  workflow_dispatch:

env:
  BRANCH_NAME: ${{ github.head_ref || github.ref_name }}

jobs:
  publish-snapshot:
    name: Publish Snapshot to GitHub Packages
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: 8
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # `publish` builds the bundled ts-frontend runtime via npm, so the Node
      # version baked into the published artifact must be pinned explicitly.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: jacodb-ets/ts-frontend/.nvmrc
          cache: npm
          cache-dependency-path: jacodb-ets/ts-frontend/package-lock.json

      - name: Generate snapshot version
        id: snapshot_version
        run: |
          # Replace non-alphanumeric characters in branch name with hyphens
          SAFE_BRANCH=$(echo "${BRANCH_NAME}" | sed 's#[^A-Za-z0-9._-]#-#g')
          SHORT_SHA=$(echo "${GITHUB_SHA}" | cut -c1-8)
          VERSION="${SAFE_BRANCH}+${SHORT_SHA}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "::notice title=Snapshot Version::Generated snapshot version: ${VERSION}"

      - name: Publish snapshot
        run: ./gradlew publish -Pversion=${{ steps.snapshot_version.outputs.version }}
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Write summary
        run: |
          echo "## 📦 Snapshot Published" >> $GITHUB_STEP_SUMMARY
          echo "**Project:** \`${{ github.repository }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** \`${{ steps.snapshot_version.outputs.version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** \`${BRANCH_NAME}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${GITHUB_SHA}\`" >> $GITHUB_STEP_SUMMARY
